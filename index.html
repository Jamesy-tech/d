        <script>
            function goToPath() {
                let path = document.getElementById("path").value.trim();

                if (!path) return;

                if (!path.startsWith("http://") && !path.startsWith("https://")) {
                    if (!path.startsWith("/")) {
                        path = "/" + path;
                    }

                    window.location.href = path;
                } else {
                    window.location.href = path;
                }
            }

            document.getElementById("path").addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    goToPath();
                }
            });
        </script>
