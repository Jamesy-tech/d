<!DOCTYPE html>
<html>
    <head>
        <title>d</title>
        <link rel="icon" href="https://jamesy-tech.github.io/icon8.png">
        <style>
            body {
                margin: 24px;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 16px;
                color: #111;
                background: #fff;
            }

            h1 {
                font-size: 24px;
                font-weight: normal;
                margin-bottom: 6px;
            }

            .path {
                font-size: 14px;
                margin-bottom: 18px;
            }

            .path input {
                width: 420px;
                padding: 3px 5px;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 14px;
                border: 1px solid #888;
            }

            .path button {
                padding: 3px 9px;
                font-family: Georgia, "Times New Roman", serif;
                font-size: 14px;
                background: #eee;
                border: 1px solid #888;
                cursor: pointer;
            }

            .path button:hover {
                background: #ddd;
            }

            .info {
                margin-bottom: 14px;
            }

            .file {
                margin: 5px 0;
            }

            .folder {
                margin: 5px 0;
            }

            a {
                color: #0000ee;
                text-decoration: underline;
            }

            hr {
                border: 0;
                border-top: 1px solid #aaa;
                margin: 14px 0;
            }

            footer {
                margin-top: 25px;
                font-size: 13px;
                color: #555;
            }
        </style>
    </head>

    <body>

        <h1>/Jamesy-tech/d/</h1>

        <div class="path">
            <a href="../">Home</a>
            &nbsp;|&nbsp;
            <input
                type="text"
                id="path"
                value="/Jamesy-tech/d/"
                placeholder="Enter a file or directory..."
            >
            <button onclick="goToPath()">Go</button>
        </div>

        <hr>

        <div class="info">
            Directory listing:
            <strong>/Jamesy-tech/d/</strong>
        </div>

        <div class="folder">
            <a href="../">../</a>
        </div>

        <div class="folder">
            <a href="untitled/">untitled/</a>
        </div>

        <hr>

        <div class="file">
            <a href="https://jamesy-tech.github.io">home.url</a>
        </div>

        <div class="file">
            <a href="https://jamesy-tech.github.io/jamesy-creator">jamesycreator.url</a>
        </div>

        <div class="file">
            <a href="https://jamesy-tech.github.io/BookUI">bookui.url</a>
        </div>

        <div class="file">
            <a href="https://github.com/Jamesy-tech/toolbox">toolbox.url</a>
        </div>

     <footer>
    &copy; Jamesy-tech
</footer>

        <script>
            function goToPath() {
                let path = document.getElementById("path").value.trim();

                if (!path) return;

                if (!path.startsWith("http://") && !path.startsWith("https://")) {
                    if (!path.startsWith("/")) {
                        path = "/" + path;
                    }

                    window.location.href = path;
                } else {
                    window.location.href = path;
                }
            }

            document.getElementById("path").addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    goToPath();
                }
            });
        </script>

    </body>
</html>
